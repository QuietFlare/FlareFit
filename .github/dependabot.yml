version: 2
updates:
  # The app has no third-party package dependencies, so the only thing to keep
  # current is the GitHub Actions we pin in workflows. (Add a "swift" ecosystem
  # entry here if Swift Package Manager dependencies are ever introduced.)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
