name: CI

# PR gate via the shared pipeline (github.com/QuietFlare/ci-workflows):
# SwiftLint + build + simulator tests + AI review, one thin caller.
#
# PRs + on-demand only — NOT every push to main: macOS runners bill at 10x on
# a private repo. The AI review needs the GEMINI_API_KEY repo secret and skips
# automatically on workflow_dispatch runs (no PR context).
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # AI review comments
  issues: write          # AI review comments

jobs:
  pr:
    uses: QuietFlare/ci-workflows/.github/workflows/pr-pipeline.yml@v1
    with:
      project: FlareFit.xcodeproj
      scheme: FlareFit
      only-testing: FlareFitTests
      swiftlint: true
      ai-review: true
      review-instructions: >-
        Focus on correctness bugs, Swift concurrency / @MainActor issues,
        retain cycles, SwiftUI state pitfalls, and security (API keys live in
        the Keychain and are sent only in request headers over HTTPS; the app
        is on-device with no accounts or tracking). Be brief where fine.
    secrets:
      gemini-api-key: ${{ secrets.GEMINI_API_KEY }}
