name: TestFlight

# Archive + upload to TestFlight. GATED: needs the paid Apple Developer account
# (enrollment pending) plus three repo secrets (see below). Triggered by pushing
# a version tag (e.g. `git tag v1.0.0 && git push --tags`) or run manually.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID      — App Store Connect API key ID
#   ASC_ISSUER_ID   — App Store Connect API issuer ID
#   ASC_KEY_P8      — the full contents of the AuthKey_XXXX.p8 file
#
# The App Store Connect API key (App Store Connect → Users and Access → Integrations)
# lets Xcode do cloud signing (-allowProvisioningUpdates) and upload without
# storing certificates in the repo.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Preflight — confirm secrets are set
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          : "${ASC_KEY_ID:?Missing secret ASC_KEY_ID — see this workflow's header}"
          : "${ASC_ISSUER_ID:?Missing secret ASC_ISSUER_ID}"
          : "${ASC_KEY_P8:?Missing secret ASC_KEY_P8}"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$HOME/private_keys"
          echo "$ASC_KEY_P8" > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Archive (cloud signing via API key)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project FlareFit.xcodeproj \
            -scheme FlareFit \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/FlareFit.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Export & upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/FlareFit.xcarchive \
            -exportOptionsPlist .github/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
